name: Deploy Pages (HTML + scholarly PDFs)

# Path B, per Sprint 8.0's decision record (site/CHANGELOG.md): Cloudflare
# Pages' own build image is undocumented for headless-Chrome support and
# runs inside a gVisor sandbox, so PDF typesetting happens here in GitHub
# Actions instead, producing a complete dist/ (HTML + paper.pdf beside each
# paper's index.html) that gets handed to Cloudflare Pages as a finished
# artifact via `wrangler pages deploy` — never as a build Cloudflare itself
# runs. This workflow is the deploy path; it does not replace or duplicate
# `npm run build` / `npm run build:pdfs`, both defined in site/package.json.
#
# Required before push-triggered runs will actually deploy anything (not
# verified from this environment — no GitHub CLI / secrets access here):
#   1. Add repository secrets CLOUDFLARE_API_TOKEN and
#      CLOUDFLARE_ACCOUNT_ID (Settings -> Secrets and variables -> Actions).
#   2. In the Cloudflare Pages project's dashboard: Build -> Branch control
#      -> turn OFF automatic deployments for both the production branch and
#      preview branches. Leaving Cloudflare's own Git integration on means
#      every push also triggers a Pages-native build with NO PDFs, racing
#      this workflow's PDF-complete build for the same URL.
# Until both are done, use the "Run workflow" button (workflow_dispatch) to
# test this pipeline by hand rather than assuming a push has deployed
# anything.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site (Astro + Pagefind)
        run: npm run build

      - name: Build scholarly PDFs
        # No separate "install browser" step: @vivliostyle/cli uses
        # puppeteer-core, not the full puppeteer package, so there's no
        # npm-install-time Chromium download to run ahead of time. The
        # pinned CLI (site/package.json's @vivliostyle/cli devDependency,
        # exact version 11.2.0, proven in Sprint 8.0) downloads its own
        # Chrome build to its cache on first invocation inside this step,
        # the same lazy-download behavior confirmed locally.
        run: npm run build:pdfs

      - name: Validate Scholar/PDF identity
        # Sprint 8.6 — the fail-closed gate: a paper's citation_pdf_url /
        # MediaObject.contentUrl / Download href / JSON-LD article URL all
        # have to agree with each other and with the real route, the PDF
        # itself has to parse and carry every #ref-* citation and research-
        # relation link the HTML promises, and no non-paper entry may carry
        # any of this. See site/scripts/validate-research-pdfs.mjs's own
        # header for exactly what this does and does not check (visual
        # rows — table/primitive rendering, page-1 layout — stay a human
        # raster check, not automated here).
        run: npm run validate:pdfs

      - name: Deploy to Cloudflare Pages
        # Sprint 9.0 — calls the pinned `wrangler` (site/package.json's
        # devDependency, exact version, package-lock.json committed) via the
        # `deploy:pages` npm script, never bare `npx wrangler`. `npm ci`
        # above already installed exactly that version into
        # node_modules/.bin/wrangler; `npm run` resolves a script's command
        # against that local bin first, so this cannot silently pick up a
        # different release the way an unpinned `npx wrangler` could. The
        # version itself is a package-lock.json fact — do not add an
        # `@x.y.z` suffix here; bump the pin in package.json instead.
        # Sprint 9.3 fix — a real GitHub Actions bug, found live: a
        # multi-line commit message containing an embedded `"..."` phrase
        # (e.g. this exact sentence you're reading) broke the deploy step,
        # because `${{ github.event.head_commit.message }}` gets spliced
        # into this `run:` script as raw text *before* bash parses the
        # line — the embedded quote characters closed the
        # `--commit-message="..."` string early, and the rest of the
        # message was parsed as bogus extra CLI arguments (confirmed
        # directly: wrangler's error was "Unknown arguments: from,
        # GitHub... preview deploy, and that the" — a literal fragment of
        # the commit body). Every commit message before this one happened
        # to be quote-free, so the bug was latent since Sprint 8.2 and
        # never fired. Fixed the standard way GitHub's own
        # security-hardening docs recommend for any dynamic/untrusted
        # `${{ }}` value used inside `run:`: pass it through an
        # intermediate `env:` var first, then reference it as a shell
        # variable (`"$COMMIT_MESSAGE"`) — bash does not re-parse for quote
        # characters inside an already-double-quoted variable expansion,
        # so embedded quotes in the value are inert instead of breaking
        # the command.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || format('workflow_dispatch by {0}', github.actor) }}
        run: |
          BRANCH="${{ github.ref_name }}"
          npm run deploy:pages -- \
            --project-name=cybernetics-mbp-site \
            --branch="$BRANCH" \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$COMMIT_MESSAGE"
